<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0102 HTML, CSS e JavaScript</title>
</head>

<body>
  <h1 id="texto">Olá, Mundo!</h1>
  Parte sem estilo
  <style>
    h1 {
      color: blueviolet;
    }
  </style>

  <script>
    function mudarCor() { texto.style.color = "blue"; }
    texto.addEventListener("click", mudarCor);
  </script>

</body>

</html>
